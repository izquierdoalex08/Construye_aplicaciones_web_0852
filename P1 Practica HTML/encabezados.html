<!DOCTYPE html> <!-- Declara el archivo como HTML -->
<html lang="en"> <!-- Define el idioma de la página -->

<head> <!-- Inicia la configuyración de la página -->
  <meta charset="UTF-8"> <!-- Permite caracteres especiales -->
  <meta name ="viewsport" content="width=device-width,initial-scale=1.0"> <!-- Ajusta la página según el tamaño de la pantalla -->
  <title> Encabezados HTML </title>  <!-- Título de la página web -->
</head> <!-- Cierra la etiqueta de las instrucciones que le dan diseño a la página -->

<body> <!-- Inicia la etiqueta del cuerpo de la página, esto es lo visible en la página web -->
  <h1> Titulo 1 </h1> <!-- Diferentes tipos de títulos, según su número varía el tamaño del texto, el h1 es el título principal y el h6 el subtítulo mas pequeño -->
  <h2> Titulo 2 </h2>
  <h3> Titulo 3 </h3>
  <h4> Titulo 4 </h4>
  <h5> Titulo 5 </h5>
  <h6> Titulo 6 </h6>
</body> <!-- Cierra la etiqueta -->
</html> <!-- Pone fin al código-->
