<!DOCTYPE html> <!-- Declara el archivo como HTML -->
<html lang="en"> <!-- Define el idioma de la página -->

<head> <!-- Inicia la configuyración de la página -->
  <meta charset="UTF-8"> <!-- Permite caracteres especiales -->
  <meta name ="viewsport" content="width=device-width,initial-scale=1.0"> <!-- Ajusta la página según el tamaño de la pantalla -->
  <title> Imagenes en HTML </title>  <!-- Título de la página web -->
</head> <!-- Cierra la etiqueta de las instrucciones que le dan diseño a la página -->

<body> <!-- Inicia la etiqueta del cuerpo de la página, esto es lo visible en la página web -->
  <h2>Imagenes en HTML</h2> <!-- Titulo  -->
  <h3>Locales</h3> <!-- Subtitulo un poco más pequeño -->
  <img src="caritas.png" alt="Imagen de carita feliz"> <!-- Llama a una imagen llamada caritas -->
  <h3>Locales redismensionado</h3> <!-- Subtitulo -->
  <img src="imagenes/carita.png" alt="" width="200" height="100"> <!-- Imagen con tamaño definido -->
  <h3>Desde internet</h3> <!-- Subtitulo -->
  <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200" alt=""> <!-- Imagen con enlace desde internet, src es la fuente de esta -->
  <h3>Animaciones</h3>
  <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200" alt=""> <!-- Gif con tamaño definido-->
</body> <!-- Cierra la etiqueta -->
</html> <!-- Pone fin al código-->
