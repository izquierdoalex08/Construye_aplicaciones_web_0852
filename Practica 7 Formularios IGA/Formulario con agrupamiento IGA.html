<!DOCTYPE html> <!-- Declara el archivo como HTML --> 
<html lang="en"> <!-- Define el idioma de la página -->
<head> <!-- Configuración de la página -->
	<meta charset="UTF-8"> <!-- Permite caracteres especiales -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ajusta la página según el tamaño de la pantalla -->
	<title>Formularios en HTML</title> <!-- Titulo de la página web -->
</head> <!-- Cierra la configuración -->
<body>
	<form action="" method="post">
		<fieldset>
			<legend>Datos personales</legend>
			Nombre y apellido:
			<input type="text" name="nombre_apellido"><br>
			Documento valido:
			<input type="file" name="documento"><br>
			Fecha de nacimiento:

		<input type="date" name="fecha_nacimiento">
		</fieldset>
		<fieldset>
			<legend>Datos de estudio:</legend>
			Nombre de la escuela:
			<input type="text" name="escuela"><br>
			Certificado valido:
			<input type="file" name="certificado"><br>
			Fecha de egreso:
			<input type="date" name="fecha_egreso">
		</fieldset>
		<br>
		<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
		<button type="reset">Borrar <i class="fa fa-trash"></i></button>
	</form>
</body> <!-- Cierra el cuerpo de la página -->
</html> <!-- Ciera el documento HTML -->
