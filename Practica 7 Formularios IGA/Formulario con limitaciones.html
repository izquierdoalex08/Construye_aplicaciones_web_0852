<!DOCTYPE html> <!-- Declara el archivo como HTML --> 
<html lang="en"> <!-- Define el idioma de la página -->
<head> <!-- Configuración de la página -->
	<meta charset="UTF-8"> <!-- Permite caracteres especiales -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ajusta la página según el tamaño de la pantalla -->
	<title>Formularios en HTML</title> <!-- Titulo de la página web -->
</head> <!-- Cierra la configuración -->
<body> <!-- Abre el cuerpo del usuario -->
	<form action="" method="post"> <!-- Abre el formulario -->
		Ingresa tu nombre:
		<!-- Desahbilitacion de campo -->
		<input type="text" name="nombre" disabled><br> <!-- El usuario no puede escribir ni hacer clic en esta casilla -->
		<!-- Limitacion de caracteres -->
		Contraseña:
		<input type="password" name="pass" maxlength="5"><br> <!-- Permite escribir hasta 5 caracteres -->
		<!-- Solo lectura -->
		Comentarios: 
		<textarea name="comentarios" readonly> 
        <!-- Permite copiar el comentario o seleccionarlo pero no puede modificarlo no borrarlo -->
		Este es mi comentario y no se puede borrar 
		</textarea><br> <!-- Cierra la etiqueta de texto -->
	</form> <!-- Cierra el formulario -->
</body> <!-- Cierra el cuerpo de la página -->
</html> <!-- Ciera el documento HTML -->
