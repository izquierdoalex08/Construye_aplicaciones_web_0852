<!DOCTYPE html> <!-- Declara el archivo como HTML --> 
<html lang="en"> <!-- Define el idioma de la página -->
<head> <!-- Configuración de la página -->
	<meta charset="UTF-8"> <!-- Permite caracteres especiales -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ajusta la página según el tamaño de la pantalla -->
	<title>Formularios en HTML</title> <!-- Titulo de la página web -->
</head> <!-- Cierra la configuración -->
<body> <!-- Abre el cuerpo de la página -->
	<form action="" method="post"> <!-- Abre el formulario y define como y donde guardar la informacióm llenada -->
		Ingresa tu nombre: <!-- Le dice al usuario  que ingrese su nombre -->
		<input type="text" name="nombre"> <!-- Casilla para ingresar el nombre -->
		<br> <!-- Salto de línea -->
		<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button> <!-- button type="submit" permite meter cosas dentro del botón como imágenes -->
		<button type="reset">Borrar <i class="fa fa-trash"></i></button> <!-- Vacía el formulario tiene la misma flexibilidad que el botón anterior -->
	</form> <!-- Cierra el formulario -->
</body> <!-- Cierra el cuerpo de la página -->
</html> <!-- Ciera el documento HTML -->
