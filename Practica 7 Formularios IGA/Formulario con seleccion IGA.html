<!DOCTYPE html> <!-- Declara el archivo como HTML --> 
<html lang="en"> <!-- Define el idioma de la página -->
<head> <!-- Configuración de la página -->
	<meta charset="UTF-8"> <!-- Permite caracteres especiales -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ajusta la página según el tamaño de la pantalla -->
	<title>Formularios en HTML</title> <!-- Titulo de la página web -->
</head> <!-- Cierra la configuración -->
<body> <!-- Abre el cuerpo la página -->
	<form action="" method="post"> <!-- Abre el formulario -->
		Ingresa tu nombre: <!-- Le indica al usuario que escriba su nombre -->
		<input type="text" name="nombre"> <!-- Casilla donde el usuario escribe su nombre -->

		<br> <!-- Salto de línea --> 
		Selecciona tu pais: <!-- Texto de instrucciones -->
		<select name="pais"> <!-- Etiqueta que crea la lista despegable de opciones, name=país ayuda al servidor a recibir la opción seleccionada según el numero -->
		<!-- Crea las opciones para la lista, cada opción esta definida por un numero que recibe el servidor -->	
		<option value="1">Argentina</option>
		<option value="2">España</option>
		<option value="3">Mexico</option>
		<option value="4">Guatemala</option>
		<option value="5">Honduras</option>
		<option value="6">El Salvador</option>
		<option value="7">Venezuela</option>
		<option value="8">Colombia</option>
		</select> <!-- Cierra la lista despegable -->
		<br> <!-- Salto de línea -->
		<input type="submit" value="enviar"> <!-- Enviá el nombre y el país seleccionado -->
		<input type="reset" value="borrar"> <!-- Limpia los datos seleccionados -->
	</form> <!-- Cierra el formulario -->
</body> <!-- Cierra el cuerpo de la página -->
</html> <!-- Ciera el documento HTML -->
